name: Validate Namello 1.0.2

on:
  pull_request:
    branches:
      - feature/firebase-token-backend-auth
  push:
    branches:
      - fix/namello-1-0-2-config-alignment

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Check version consistency
        run: npm run verify
      - name: Run existing tests
        run: npm test
      - name: Build web distribution
        run: npm run build
      - name: Install backend dependencies
        run: npm install --prefix backend --no-audit --no-fund
      - name: Check backend JavaScript syntax
        run: npm --prefix backend run check
