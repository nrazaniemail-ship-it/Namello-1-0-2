name: Namello Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build and Sign Namello APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android licenses and install SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f index.html
          test -f capacitor.config.ts
          test -f version.json
          test -f scripts/set-android-version.mjs
          test -f scripts/verify-namello-version.mjs
          test -f assets/icon-only.png

      - name: Install dependencies
        run: npm install

      - name: Verify Namello version
        run: node scripts/verify-namello-version.mjs

      - name: Run tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Build web application
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Set Android version
        run: node scripts/set-android-version.mjs

      - name: Prepare launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp assets/icon-only.png \
            android/app/src/main/res/drawable-nodpi/namello_launcher.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"',
                        'android:icon="@drawable/namello_launcher"')
          s = s.replace('android:roundIcon="@mipmap/ic_launcher_round"',
                        'android:roundIcon="@drawable/namello_launcher"')
          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build unsigned Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/namello-signing"
          chmod 700 "$RUNNER_TEMP/namello-signing"
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/namello-signing/namello-release.p12"
          chmod 600 "$RUNNER_TEMP/namello-signing/namello-release.p12"
          test -s "$RUNNER_TEMP/namello-signing/namello-release.p12"

      - name: Sign Release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"

          VERSION="$(node -p "require('./version.json').version")"
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/Namello-${VERSION}-release.apk"
          APK_SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          KEYSTORE="$RUNNER_TEMP/namello-signing/namello-release.p12"

          test -f "$UNSIGNED_APK"
          test -x "$APK_SIGNER"

          "$APK_SIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:STORE_PASSWORD \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          "$APK_SIGNER" verify --verbose --print-certs "$SIGNED_APK"

          echo "SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v6
        with:
          name: Namello-Android-Release-APK
          path: ${{ env.SIGNED_APK }}
          if-no-files-found: error
          retention-days: 14
