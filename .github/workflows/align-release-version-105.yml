name: Align Namello release version 1.0.5
on:
  push:
    branches:
      - feature/namello-login-ui
    paths:
      - .github/workflows/align-release-version-105.yml
      - scripts/bump-version.mjs
permissions:
  contents: write
jobs:
  align-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/namello-login-ui
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Align app version markers
        run: node scripts/bump-version.mjs 1.0.5 72
      - name: Align backend package and health version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('backend/package.json', 'utf8'));
          p.version = '1.0.5';
          fs.writeFileSync('backend/package.json', JSON.stringify(p, null, 2) + '\n');
          const f = 'backend/server.mjs';
          if (fs.existsSync(f)) {
            let s = fs.readFileSync(f, 'utf8');
            s = s.replace(/(service: 'namello-sync', version: ')[^']+(')/, (_m, a, b) => a + '1.0.5' + b);
            s = s.replace(/(version:\s*')[0-9]+\.[0-9]+\.[0-9]+(')/, (_m, a, b) => a + '1.0.5' + b);
            fs.writeFileSync(f, s);
          }
          for (const file of ['public/README.md', 'README.md']) {
            if (fs.existsSync(file)) {
              let r = fs.readFileSync(file, 'utf8');
              r = r.replace(/^# Namello [0-9.]+/m, '# Namello 1.0.5');
              fs.writeFileSync(file, r);
            }
          }
          const changelog = 'CHANGELOG.md';
          if (fs.existsSync(changelog)) {
            let c = fs.readFileSync(changelog, 'utf8');
            c = c.replace(/^# Namello [0-9.]+ — Version Code \d+/m, '# Namello 1.0.5 — Version Code 72');
            fs.writeFileSync(changelog, c);
          }
          NODE
      - name: Commit aligned version files
        run: |
          if git diff --quiet; then
            echo "Version markers already aligned."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: align all Namello version markers to 1.0.5"
            git push origin HEAD:feature/namello-login-ui
          fi
      - name: Verify version and test
        run: |
          npm run build
          npm run verify
          npm test
          npm run typecheck
          if [ -f backend/server.mjs ]; then node --check backend/server.mjs; fi
