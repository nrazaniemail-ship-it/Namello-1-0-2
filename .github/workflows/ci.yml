name: Validate Namello source

on:
  pull_request:
    branches:
      - feature/firebase-token-backend-auth
  push:
    branches:
      - fix/namello-1-0-2-config-alignment

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Verify release consistency
        run: npm run verify
      - name: Verify Firebase web config and authorized origin
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const html = await readFile('auth-preview.html', 'utf8');
          const block = html.match(/const\s+firebaseConfig\s*=\s*\{([\s\S]*?)\}/);
          if (!block) throw new Error('firebaseConfig block not found in auth-preview.html');
          const apiKey = block[1].match(/apiKey\s*:\s*["']([^"']+)["']/)?.[1];
          const projectId = block[1].match(/projectId\s*:\s*["']([^"']+)["']/)?.[1];
          if (!apiKey || !projectId) throw new Error('Firebase apiKey/projectId missing');
          if (projectId !== 'namello-1-0-2') throw new Error('Unexpected Firebase projectId: ' + projectId);
          console.log('Firebase projectId:', projectId);
          console.log('API key length:', apiKey.length, '(key not printed)');
          const response = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=' + encodeURIComponent(apiKey), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Referer': 'https://nrazaniemail-ship-it.github.io/'
            },
            body: JSON.stringify({
              identifier: 'namello-diagnostic@example.invalid',
              continueUri: 'https://nrazaniemail-ship-it.github.io'
            }),
            signal: AbortSignal.timeout(20000)
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error('Firebase rejected key/origin (HTTP ' + response.status + '): ' + (data.error?.message || 'unknown error'));
          }
          console.log('Firebase accepted the web key and GitHub Pages origin (HTTP ' + response.status + '). Full Google sign-in is not proven by this check.');
          NODE
      - name: Verify live backend health and CORS
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://namello-backend-test.onrender.com';
          const origin = 'https://nrazaniemail-ship-it.github.io';
          let health;
          let lastError = '';
          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              const r = await fetch(base + '/healthz', {
                headers: { 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(20000)
              });
              if (!r.ok) throw new Error('healthz HTTP ' + r.status);
              health = await r.json();
              break;
            } catch (e) {
              lastError = e.message;
              console.log('Health attempt ' + attempt + '/3 failed: ' + lastError);
              if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          if (!health) throw new Error('Live backend health check failed: ' + lastError);
          console.log('Live backend health:', JSON.stringify(health));
          if (health.authMode !== 'firebase') throw new Error('Live backend is not in Firebase auth mode');
          if (health.version !== '1.0.2') throw new Error('Live backend version is not 1.0.2');
          let preflight;
          lastError = '';
          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              preflight = await fetch(base + '/v1/auth/firebase/verify', {
                method: 'OPTIONS',
                headers: {
                  'Origin': origin,
                  'Access-Control-Request-Method': 'POST',
                  'Access-Control-Request-Headers': 'content-type'
                },
                signal: AbortSignal.timeout(15000)
              });
              break;
            } catch (e) {
              lastError = e.message;
              console.log('CORS attempt ' + attempt + '/3 failed: ' + lastError);
              if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 3000));
            }
          }
          if (!preflight) throw new Error('CORS preflight request failed: ' + lastError);
          const allowedOrigin = preflight.headers.get('access-control-allow-origin');
          console.log('CORS preflight:', preflight.status, 'allow-origin:', allowedOrigin || '(missing)');
          if (preflight.status !== 204 || allowedOrigin !== origin) {
            throw new Error('Live backend CORS does not allow the GitHub Pages origin');
          }
          NODE
      - name: Run tests
        run: npm test
      - name: Build web assets
        run: npm run build
      - name: Install backend dependencies
        run: npm --prefix backend install
      - name: Check backend syntax
        run: npm --prefix backend run check
