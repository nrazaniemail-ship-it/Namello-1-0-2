<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10111b">
<title>Namello · Firebase Auth Preview</title>
<style>
:root{color-scheme:dark;--bg:#10111b;--panel:#181a29;--line:#2d3045;--muted:#9a9db5;--text:#f7f7ff;--accent:#8171ff;--accent2:#5c8cff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 5%,#28234e 0,transparent 42%),radial-gradient(ellipse at 95% 90%,#142d4b 0,transparent 38%),var(--bg);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;color:var(--text);display:grid;place-items:center;padding:24px}
.wrap{width:min(100%,440px)}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:26px;font-weight:800;font-size:25px;letter-spacing:.3px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 30px #6c64ff55;font-size:22px}
.card{background:#181a29ed;border:1px solid var(--line);border-radius:24px;padding:clamp(22px,6vw,34px);box-shadow:0 24px 90px #0005;backdrop-filter:blur(16px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.top small{color:var(--muted)}.signup{border:0;background:transparent;color:#b9b0ff;font:inherit;font-weight:700;cursor:pointer}.eyebrow{font-size:12px;letter-spacing:2px;color:#a9a0ff;font-weight:800;text-transform:uppercase;margin:0 0 8px}h1{font-size:30px;letter-spacing:-.8px;margin:0 0 8px}.sub{margin:0 0 26px;color:var(--muted)}label{display:block;font-size:13px;font-weight:650;margin:16px 0 8px}.field{display:flex;align-items:center;background:#111320;border:1px solid #35384e;border-radius:12px;min-height:48px;transition:border .15s}.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #8171ff20}input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:var(--text);padding:13px 14px;font:inherit}input::placeholder{color:#6e728a}.reveal{border:0;background:transparent;color:#aeb1c8;padding:10px 13px;cursor:pointer}.row{display:flex;justify-content:flex-end;margin:12px 0 20px}.link{color:#b7adff;text-decoration:none;font-size:13px;font-weight:650}.primary{width:100%;border:0;border-radius:12px;padding:14px;background:linear-gradient(100deg,var(--accent),var(--accent2));color:white;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 8px 24px #665cff38}.or{display:flex;align-items:center;gap:12px;color:#777b94;font-size:12px;margin:22px 0}.or:before,.or:after{content:"";height:1px;flex:1;background:var(--line)}.google,.secondary{width:100%;display:flex;justify-content:center;align-items:center;gap:10px;border:1px solid #3a3d52;background:#202234;border-radius:12px;padding:12px;color:var(--text);font:inherit;font-weight:700;cursor:pointer}.google b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:white;color:#4285f4;font-size:15px}.foot{text-align:center;color:#777b94;font-size:12px;margin:20px 0 0}.notice{display:none;margin-top:14px;padding:10px 12px;border:1px solid #6a5933;background:#352d1d;border-radius:10px;color:#f4dca2;font-size:12px;overflow-wrap:anywhere}.notice.show{display:block}.notice.error{border-color:#75414b;background:#351f28;color:#ffb7c2}.account{display:none;margin-top:14px;padding:12px;border:1px solid #355a49;background:#1b3029;border-radius:12px;color:#b6f2d0;overflow-wrap:anywhere}.account.show{display:block}.hidden{display:none!important}@media(max-width:420px){body{padding:16px}.brand{margin-bottom:18px}.card{border-radius:20px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body>
<main class="wrap">
  <div class="brand"><span class="mark">N</span><span>Namello</span></div>
  <section class="card" aria-labelledby="heading">
    <div class="top"><small id="modeNote">WELCOME BACK</small><button class="signup" id="switchMode" type="button">Create account</button></div>
    <p class="eyebrow">TRADING JOURNAL</p>
    <h1 id="heading">Sign in to Namello</h1>
    <p class="sub" id="subtitle">Pick up where you left off and keep your trading insights in sync.</p>
    <form id="authForm">
      <label for="email">Email address</label><div class="field"><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
      <label for="password">Password</label><div class="field"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" minlength="8" required><button class="reveal" id="togglePassword" type="button" aria-label="Show password">Show</button></div>
      <div class="row" id="forgotRow"><a class="link" href="#" id="forgot">Forgot password?</a></div>
      <button class="primary" id="submit" type="submit">Sign in</button>
    </form>
    <div class="or" id="orDivider">OR CONTINUE WITH</div>
    <button class="google" id="google" type="button"><b>G</b> Continue with Google</button>
    <div class="account" id="account" role="status"></div>
    <button class="secondary hidden" id="signout" type="button" style="margin-top:12px">Sign out</button>
    <div class="notice" id="notice" role="status" aria-live="polite"></div>
  </section>
  <p class="foot">Firebase + Namello backend authentication test page. The backend must be deployed and configured before cloud sync can work.</p>
</main>
<script>
(function(){
 const $=id=>document.getElementById(id);let signup=false;let auth=null;let namelloSessionToken=null;
 const API_BASE=String(window.NAMELLO_API_BASE||window.location.origin).replace(/\/+$/,'');
 const firebaseConfig={
  apiKey:"AIzaSyBEIuHNqQ2to7jzun93v1u8OGVUxVieHgc",
  authDomain:"namello-app-4.firebaseapp.com",
  projectId:"namello-app-4",
  storageBucket:"namello-app-4.firebasestorage.app",
  messagingSenderId:"376512435282",
  appId:"1:376512435282:web:93302f6faa9388fd243b8b",
  measurementId:"G-CXC50K2LG3"
 };
 function message(s,isError=false){$('notice').textContent=s;$('notice').classList.add('show');$('notice').classList.toggle('error',isError)}
 function clearMessage(){$('notice').classList.remove('show','error');$('notice').textContent=''}
 function friendlyError(e){
  const code=e&&e.code||'';
  const map={
   'auth/email-already-in-use':'An account with this email already exists. Try signing in.',
   'auth/invalid-email':'Please enter a valid email address.',
   'auth/weak-password':'Choose a stronger password (at least 8 characters).',
   'auth/user-not-found':'No account was found for this email.',
   'auth/wrong-password':'The email or password is incorrect.',
   'auth/invalid-credential':'The email or password is incorrect.',
   'auth/too-many-requests':'Too many attempts. Please wait and try again.',
   'auth/network-request-failed':'Network error. Check your internet connection.',
   'auth/popup-blocked':'The sign-in window was blocked. Try again or allow pop-ups.',
   'auth/unauthorized-domain':'This website domain is not in Firebase Authentication → Settings → Authorized domains.',
   'auth/operation-not-allowed':'This sign-in method is not enabled in Firebase Authentication.',
   'auth/account-exists-with-different-credential':'This email already uses another sign-in method. Sign in with that method first.',
   'auth/requires-recent-login':'Please sign in again and retry.'
  };
  return map[code]||('Authentication failed ('+(code||'unknown')+'). '+(e&&e.message?e.message:'Please try again.'));
 }
 function setBusy(b){$('submit').disabled=b;$('google').disabled=b;$('switchMode').disabled=b;$('submit').style.opacity=b?'.65':'1';$('google').style.opacity=b?'.65':'1'}
 async function exchangeFirebaseToken(user){
  namelloSessionToken=null;
  try{
   const idToken=await user.getIdToken();
   const response=await fetch(API_BASE+'/v1/auth/firebase/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken})});
   const data=await response.json().catch(()=>({}));
   if(!response.ok){
    const messages={email_verification_required:'Please verify your email using the link Firebase sent, then sign in again.',email_not_verified:'This account email is not verified. Verify it before using cloud sync.',firebase_auth_disabled:'The Namello backend is not configured for Firebase authentication yet.',invalid_firebase_token:'Firebase token validation failed. Sign out and sign in again.'};
    throw new Error(messages[data.error]||('Namello backend rejected sign-in ('+(data.error||response.status)+').'));
   }
   if(!data.token)throw new Error('Backend did not return a Namello session token.');
   namelloSessionToken=data.token;
   $('account').textContent='Signed in as '+(data.user?.email||user.email||user.displayName||'Firebase user')+' · Namello backend session active';
   return true;
  }catch(err){namelloSessionToken=null;message(err.message||'Could not connect to Namello backend.',true);return false}
 }
 $('togglePassword').addEventListener('click',()=>{const p=$('password'),show=p.type==='password';p.type=show?'text':'password';$('togglePassword').textContent=show?'Hide':'Show';$('togglePassword').setAttribute('aria-label',show?'Hide password':'Show password')});
 $('switchMode').addEventListener('click',()=>{signup=!signup;$('modeNote').textContent=signup?'GET STARTED':'WELCOME BACK';$('heading').textContent=signup?'Create your Namello account':'Sign in to Namello';$('subtitle').textContent=signup?'Create an account to keep your trading journal organized.':'Pick up where you left off and keep your trading insights in sync.';$('submit').textContent=signup?'Create account':'Sign in';$('switchMode').textContent=signup?'I already have an account':'Create account';$('password').autocomplete=signup?'new-password':'current-password';$('forgotRow').style.display=signup?'none':'flex';clearMessage()});
 $('authForm').addEventListener('submit',async e=>{e.preventDefault();clearMessage();if(!auth){message('Firebase SDK could not load. Check your internet connection and reload.',true);return}setBusy(true);try{const email=$('email').value.trim(),password=$('password').value;if(signup){const result=await auth.createUserWithEmailAndPassword(email,password);try{await result.user.sendEmailVerification();message('Account created. A verification email was sent to '+email+'. Please check your inbox.')}catch(err){message('Account created, but verification email could not be sent: '+friendlyError(err),true)}}else{await auth.signInWithEmailAndPassword(email,password);message('Signed in successfully.')} }catch(err){message(friendlyError(err),true)}finally{setBusy(false)}});
 $('forgot').addEventListener('click',async e=>{e.preventDefault();clearMessage();if(!auth){message('Firebase SDK could not load. Check your internet connection.',true);return}const email=$('email').value.trim();if(!email){$('email').focus();message('Enter your email address first, then tap Forgot password.');return}try{await auth.sendPasswordResetEmail(email);message('If an account exists for '+email+', a password reset email has been sent.')}catch(err){message(friendlyError(err),true)}});
 $('google').addEventListener('click',async()=>{clearMessage();if(!auth){message('Firebase SDK could not load. Check your internet connection and reload.',true);return}setBusy(true);try{const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});await auth.signInWithRedirect(provider)}catch(err){message(friendlyError(err),true);setBusy(false)}});
 $('signout').addEventListener('click',async()=>{clearMessage();try{if(namelloSessionToken)await fetch(API_BASE+'/v1/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+namelloSessionToken}}).catch(()=>{});namelloSessionToken=null;await auth.signOut();message('Signed out from Firebase and Namello.')}catch(err){message(friendlyError(err),true)}});
 try{
  if(!window.firebase||!firebase.initializeApp)throw new Error('Firebase SDK unavailable');
  firebase.initializeApp(firebaseConfig);auth=firebase.auth();auth.useDeviceLanguage();
  auth.getRedirectResult().catch(err=>message(friendlyError(err),true));
  auth.onAuthStateChanged(async user=>{
   if(user){$('account').textContent='Firebase signed in as '+(user.email||user.displayName||'Firebase user')+(user.emailVerified?' · Email verified':' · Email not verified');$('account').classList.add('show');$('signout').classList.remove('hidden');$('submit').classList.add('hidden');$('google').classList.add('hidden');$('orDivider').classList.add('hidden');$('switchMode').classList.add('hidden');$('authForm').querySelectorAll('input').forEach(el=>el.disabled=true);$('forgotRow').classList.add('hidden');await exchangeFirebaseToken(user)}
   else{namelloSessionToken=null;$('account').classList.remove('show');$('signout').classList.add('hidden');$('submit').classList.remove('hidden');$('google').classList.remove('hidden');$('orDivider').classList.remove('hidden');$('switchMode').classList.remove('hidden');$('authForm').querySelectorAll('input').forEach(el=>el.disabled=false);$('forgotRow').classList.toggle('hidden',signup)}
  },err=>message(friendlyError(err),true));
 }catch(err){message('Could not initialize Firebase: '+err.message,true)}
})();
</script>
</body>
</html>
